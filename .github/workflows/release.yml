name: release
# release-please owns CHANGELOG.md, the release manifest and the pyproject.toml
# version. The plugin manifests derive their version from pyproject.toml, so
# this workflow regenerates them on the release PR branch and validates the
# result; see CONTRIBUTING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Preserve running tag/release operations; queued runs can still be superseded.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  release-please:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # release-please can otherwise release an older pending, failed merge on a
      # later green push. Require a single pending release at the validated SHA.
      - name: Select the validated release merge
        id: release-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api --paginate --slurp "repos/$REPO/pulls?state=closed&base=main&per_page=100" > "$RUNNER_TEMP/closed-prs.json"
          python3 scripts/release_guard.py --pulls "$RUNNER_TEMP/closed-prs.json" --sha "$SHA" >> "$GITHUB_OUTPUT"
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        with:
          config-file: .config/release-please-config.json
          manifest-file: .config/release-please-manifest.json
          skip-github-release: ${{ steps.release-merge.outputs.is-release-merge != 'true' }}
      # GITHUB_TOKEN-created PRs do not start PR workflows. Validate the
      # regenerated tree here, and support a manual check run for PR status.
      - name: Check out the release PR branch
        if: steps.release-please.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release-please.outputs.pr || '{}').headBranchName }}
      - name: Install python and ai-rulez
        if: steps.release-please.outputs.prs_created == 'true'
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - name: Regenerate, validate, and commit release packaging
        if: steps.release-please.outputs.prs_created == 'true'
        env:
          PR: ${{ steps.release-please.outputs.pr }}
        run: |
          BRANCH=$(jq -er .headBranchName <<< "$PR")
          mise run agents:generate
          mise run check
          git add -- AGENTS.md skills .claude-plugin .codex-plugin .agents/plugins .ai-rulez-generated.json .ai-rulez/.generated-manifest.json
          if git diff --cached --quiet; then
            echo "Generated packaging already matches the release version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate plugin packaging for the release"
          git push origin "HEAD:$BRANCH"

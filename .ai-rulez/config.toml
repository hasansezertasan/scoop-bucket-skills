# ai-rulez source of truth for agent instructions and skills.
# Edit files under .ai-rulez/, then run `npm run generate`.
# Docs: https://github.com/Goldziher/ai-rulez
#
# TOML: the AGENTS.md output below needs a custom preset declared inline.
version = "5.0"
name = "Scoop Bucket Skills"
# Agent coverage:
# - agents-md -> AGENTS.md (every agent reads it); its template must render
#                every content type the built-in presets inline (rules and
#                context), or those agents silently miss it.
# Skills are not generated per agent: [plugin] below bundles them once into
# root skills/, which Claude Code and Codex load as the plugin, and OpenCode
# loads through opencode.json (it does not scan root skills/ on its own). The
# claude, antigravity, codex, and opencode presets are omitted on purpose: they
# would only add duplicate skill copies or a duplicate context file.
presets = [{name = "agents-md", type = "markdown", path = "AGENTS.md", template = '''
<!-- Generated by ai-rulez from .ai-rulez/. Do not edit; run `npm run generate`. -->

# {{ .Name }}
{{ if .Rules }}
## Rules
{{ range .Rules }}
### {{ .Name }}

{{ .Content }}
{{- end }}{{ end }}
## Context
{{ range .Context }}
### {{ .Name }}

{{ .Content }}
{{ end -}}
'''}]
# Generated files are committed; .gitignore is not touched.
gitignore = false
# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
agents_md = false

# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
[header]
hashes = "full"

# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
[mcp]
self_server = false

# The skills cite files of the bucket they operate on (scripts/update_manifests.py,
# scripts/noop.ps1, tests/..., workflows), which this repo deliberately does not
# ship; the contract reference lists them. AR401 and AR402 would flag every such reference
# as a missing path or resource.
#
# The Antigravity adapter (plugin.json) must sit at the repository root, because
# Antigravity installs straight from the Git URL. ai-rulez warns (AR9T0) that
# Codex may load a root plugin.json too; the adapter carries only the plugin name
# and description, and scripts/check-repo.mjs keeps it equal to the Claude manifest.
# Tested with codex-cli 0.162.1: a root plugin.json declaring the Antigravity
# $schema is ignored and Codex falls back to .codex-plugin/plugin.json, but one
# declaring the portable agent-plugins.org $schema is adopted as Codex's manifest.
# Keep the Antigravity $schema, and re-test when Codex changes. AR9T0 also
# flags .mcp.json, hooks/ and the other host-loaded paths at the root, so
# scripts/check-repo.mjs rejects those itself; keep its list in step with the rule.
[lint.severity]
AR401 = "off"
AR402 = "off"
AR9T0 = "off"

# Plugin and marketplace manifests, the Codex catalog, and root skills/ are
# generated by `ai-rulez generate --plugin` and checked by `verify --plugin`.
# The version is read from package.json, the one file release-please bumps;
# it is the sole version source, so do not add a literal `version` here.
[plugin]
name = "scoop-bucket-skills"
version_from = "package.json"
description = "Skills for operating a Scoop bucket: set it up, then add, fix, triage, remove, and verify manifests."
repository = "https://github.com/hasansezertasan/scoop-bucket-skills"
keywords = ["scoop", "bucket", "windows", "manifest"]
runtimes = ["claude", "codex", "pi"]
category = "Productivity"
# content_root keeps each skill's agents/ metadata in the bundle; shared
# references are copied into every skill so it stays usable when installed alone.
content_root = ".ai-rulez"
shared_resources = ["references"]
provenance_headers = false

[plugin.author]
name = "Hasan Sezer Tasan"
url = "https://github.com/hasansezertasan"

[plugin.interface]
display_name = "Scoop Bucket Skills"
short_description = "Operate a Scoop bucket's manifests"
category = "Development"
capabilities = ["Read", "Write"]
default_prompt = ["Verify this Scoop bucket change before I open a PR."]
long_description = "Skills for operating a Scoop bucket: set it up, then add, fix, triage, remove, and verify manifests."
developer_name = "Hasan Sezer Tasan"

# Single-plugin catalogs point at the repository root ("./").
[plugin.codex]
marketplace = true

# Pi reads the root skills/ tree. ai-rulez derives the `pi` entry, the
# `pi-package` keyword and the `files` allowlist in package.json from the skills
# on disk and rewrites the whole file (sorted keys, expanded arrays), keeping
# the authored fields (scripts, devDependencies). Edit those, not the derived ones.
[plugin.pi]
skills_dir = "skills"
package_json = "merge"

[marketplace]
name = "scoop-bucket-skills"

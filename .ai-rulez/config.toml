# ai-rulez source of truth for agent instructions and skills.
# Edit files under .ai-rulez/, then run `mise run agents:generate`.
# Docs: https://github.com/Goldziher/ai-rulez
#
# TOML: the AGENTS.md output below needs a custom preset declared inline.
version = "5.0"
name = "Scoop Bucket Skills"
# Agent coverage:
# - claude      -> .claude/skills/ (Claude Code)
# - antigravity -> .agents/skills/ (Antigravity; .agents/skills/ is
#                  also read by Codex, OpenCode, and pi)
# - agents-md   -> AGENTS.md (every agent above); its template must
#                  render every content type the built-in presets inline
#                  (rules and context), or those agents silently miss it.
# The codex, opencode, and hermes presets are omitted on purpose: they would
# only add duplicate skill copies (.codex/, .opencode/) or a duplicate context
# file (.hermes.md) that those agents already pick up from the paths above.
#
# scripts/gen_agents.py deletes the side files claude and antigravity always
# write: CLAUDE.md and GEMINI.md (duplicates of AGENTS.md) and
# .agents/settings.json (an unpinned `npx -y ai-rulez@latest` MCP server).
presets = ["claude", "antigravity", {name = "agents-md", type = "markdown", path = "AGENTS.md", template = '''
<!-- Generated by ai-rulez from .ai-rulez/. Do not edit; run `mise run agents:generate`. -->

# {{ .Name }}
{{ if .Rules }}
## Rules
{{ range .Rules }}
### {{ .Name }}

{{ .Content }}
{{- end }}{{ end }}
## Context
{{ range .Context }}
### {{ .Name }}

{{ .Content }}
{{ end -}}
'''}]
# Generated files are committed; .gitignore is not touched.
gitignore = false
# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
agents_md = false

# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
[header]
hashes = "full"

# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
[mcp]
self_server = false

# The skills cite files of the bucket they operate on (scripts/add_manifest.py,
# scripts/noop.ps1, tests/..., workflows), which this repo deliberately does not
# ship; CONTRACT.md lists them. AR401 and AR402 would flag every such reference
# as a missing path or resource.
[lint.severity]
AR401 = "off"
AR402 = "off"
